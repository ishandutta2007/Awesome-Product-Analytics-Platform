<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes chartPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 5; opacity: 0.8; }
        50% { r: 8; opacity: 1; }
      }
      .bg-grid { opacity: 0.12; }
      .glow-circle { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .dash-line { stroke-dasharray: 8 6; animation: dashMove 2s linear infinite; }
      .chart-wave { animation: chartPulse 4s ease-in-out infinite; }
      .pulse-node { animation: nodePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGradient)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle class="glow-circle" cx="150" cy="120" r="180" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  <circle class="glow-circle" cx="1050" cy="360" r="220" fill="#8b5cf6" opacity="0.18" filter="url(#glow)" />
  <circle class="glow-circle" cx="800" cy="100" r="160" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Grid Pattern -->
  <g class="bg-grid" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="150" y1="0" x2="150" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="450" y1="0" x2="450" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="750" y1="0" x2="750" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
    <line x1="1050" y1="0" x2="1050" y2="480" />
  </g>

  <!-- Animated Analytics Graph Visual (Right side) -->
  <g transform="translate(680, 130)">
    <!-- Card Frame -->
    <rect width="460" height="260" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    
    <!-- Window buttons -->
    <circle cx="30" cy="30" r="5" fill="#ef4444" />
    <circle cx="48" cy="30" r="5" fill="#eab308" />
    <circle cx="66" cy="30" r="5" fill="#22c55e" />
    <text x="90" y="34" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Product Analytics Insights &amp; Funnel</text>

    <!-- Funnel / Retention Bar visuals -->
    <rect x="30" y="60" width="80" height="6" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="30" y="75" width="220" height="14" rx="4" fill="#38bdf8" opacity="0.8" />
    
    <rect x="30" y="105" width="60" height="6" rx="3" fill="#818cf8" opacity="0.9" />
    <rect x="30" y="120" width="160" height="14" rx="4" fill="#818cf8" opacity="0.8" />

    <rect x="30" y="150" width="70" height="6" rx="3" fill="#f472b6" opacity="0.9" />
    <rect x="30" y="165" width="110" height="14" rx="4" fill="#f472b6" opacity="0.8" />

    <!-- Chart Area Curve -->
    <path class="chart-wave" d="M 240 210 Q 290 130, 340 160 T 420 90 L 420 220 L 240 220 Z" fill="url(#chartGradient)" />
    <path class="dash-line" d="M 240 210 Q 290 130, 340 160 T 420 90" fill="none" stroke="#06b6d4" stroke-width="3" filter="url(#glow)" />

    <!-- Pulse nodes on graph -->
    <circle class="pulse-node" cx="240" cy="210" r="6" fill="#38bdf8" />
    <circle class="pulse-node" cx="290" cy="148" r="6" fill="#818cf8" />
    <circle class="pulse-node" cx="340" cy="160" r="6" fill="#c084fc" />
    <circle class="pulse-node" cx="420" cy="90" r="6" fill="#f472b6" />

    <!-- Metric Pill Badge -->
    <g transform="translate(270, 16)">
      <rect width="160" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <circle cx="18" cy="16" r="4" fill="#22c55e" />
      <text x="30" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">+148.5% Growth</text>
    </g>
  </g>

  <!-- Left Main Content Area -->
  <!-- Top Category Badge -->
  <g transform="translate(70, 70)">
    <rect width="270" height="34" rx="17" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.5" />
    <text x="18" y="22" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">🚀 CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Heading -->
  <text x="70" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Awesome Product</text>
  <text x="70" y="215" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Analytics Platforms</text>

  <!-- Subtitle -->
  <text x="70" y="265" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
    The definitive collection of SaaS products &amp; open-source repositories
  </text>
  <text x="70" y="292" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Funnels • Cohorts • Retention • Event Tracking • Replay • Feature Flags • Growth
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(70, 340)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
      <text x="20" y="23" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 SaaS Leaders</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(162, 0)">
      <rect width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" />
      <text x="20" y="23" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open-Source Hub</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(354, 0)">
      <rect width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#f472b6" stroke-width="1" />
      <text x="20" y="23" fill="#fce7f3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 Free Tiers &amp; Pricing</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="474" width="1200" height="6" fill="url(#textGrad)" />
</svg>